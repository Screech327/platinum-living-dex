<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Dex Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* OBS browser source. Transparent page; counter pinned bottom-left, catch pop-up stacks above it.
   Suggested source size: 460 x 300. */
:root{
  --panel:#140707; --panel-2:#1f0b0b; --border:#e0242c; --glow:rgb(224 36 44 / .55);
  --fg:#ffffff; --muted:#d9c3c3; --bar:#3a1414; --fill:#e0242c; --gold:#ffcf3f;
  --pixel:"Press Start 2P","Courier New",monospace; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden;width:100%;height:100%}
body{font-family:var(--pixel);color:var(--fg)}
.stack{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;transform-origin:bottom left}

.counter{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;row-gap:8px;align-items:end;
  min-width:340px;padding:14px 18px 12px 14px;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:4px solid var(--border);border-radius:16px;
  box-shadow:0 0 18px var(--glow),inset 0 0 0 2px rgb(0 0 0 / .5)}
.ball{grid-row:1/3;align-self:center;width:30px;height:30px}
.nums{display:flex;align-items:baseline;gap:8px;line-height:1}
.big{font-size:44px;letter-spacing:2px;text-shadow:4px 4px 0 #000;font-variant-numeric:tabular-nums}
.of{font-size:16px;color:var(--muted);text-shadow:2px 2px 0 #000}
.label{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-left:auto;align-self:flex-start}
.bar{height:8px;background:var(--bar);border-radius:4px;overflow:hidden;border:1px solid rgb(0 0 0 / .6)}
.bar i{display:block;height:100%;width:0;background:var(--fill);box-shadow:0 0 6px var(--glow);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bump .big{animation:bump .6s ease}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.18);color:var(--gold)}100%{transform:scale(1)}}

.pop{position:absolute;inset:-4px;z-index:2;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:0 18px 0 6px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));border:4px solid var(--gold);border-radius:16px;box-shadow:0 0 18px rgb(255 207 63 / .5);
  opacity:0;transform:scale(.94);transition:transform .35s cubic-bezier(.2,1.3,.4,1),opacity .25s;pointer-events:none}
.pop.show{transform:none;opacity:1}
.pop img{height:calc(100% - 4px);aspect-ratio:1;image-rendering:pixelated;filter:drop-shadow(3px 3px 0 #000)}
.pop .t1{font-size:10px;color:var(--gold);letter-spacing:1px;margin-bottom:10px}
.pop .t2{font-size:20px;line-height:1.2;text-shadow:3px 3px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop .t3{font-size:11px;color:var(--muted);text-align:right;line-height:1.8;white-space:pre}
.pop.unbox{border-color:var(--muted);box-shadow:none}
.pop.unbox .t1{color:var(--muted)}
.setup{position:absolute;inset:0;display:grid;place-items:center;font:14px/1.5 system-ui,sans-serif;color:#fff;background:#111;padding:20px;text-align:center}
.setup code{background:#333;padding:2px 6px;border-radius:4px}
.dot{position:absolute;right:8px;top:8px;width:8px;height:8px;border-radius:50%;background:#666}
.dot.on{background:#3ddc84}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="stack" id="stack">
  <div class="counter" id="counter">
    <svg class="ball" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#fff" stroke="#000" stroke-width="2"/><path d="M1.5 12a10.5 10.5 0 0 1 21 0z" fill="#e0242c" stroke="#000" stroke-width="2"/><circle cx="12" cy="12" r="3.6" fill="#fff" stroke="#000" stroke-width="2"/></svg>
    <div class="nums"><span class="big" id="big">000</span><span class="of" id="of">/493</span><span class="label" id="label"></span></div>
    <div class="bar"><i id="fill"></i></div>
    <span class="dot" id="dot" title="relay connection"></span>
    <div class="pop" id="pop" aria-live="polite">
      <img id="popImg" alt="">
      <div style="min-width:0"><div class="t1" id="popT1">CAUGHT!</div><div class="t2" id="popT2"></div></div>
      <div class="t3" id="popT3"></div>
    </div>
  </div>
</div>
<script>
(() => {
'use strict';
const P = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
const topic = P.get('t');
const mode = P.get('mode') || 'living';              // living | sinnoh | seen
const showPop = P.get('pop') !== '0';
const showLabel = P.get('label') !== '0';
const scale = parseFloat(P.get('scale') || '1');
const hideDot = P.get('dot') === '0';
const SPRITE = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iv/platinum/${id}.png`;
const MODES = { living: { key: 'boxed', of: 493, label: 'Living Dex' }, sinnoh: { key: 'caught', of: 210, label: 'Sinnoh caught' }, seen: { key: 'seen', of: 210, label: 'Sinnoh seen' } };
const M = MODES[mode] || MODES.living;
const $ = id => document.getElementById(id);
$('stack').style.transform = `scale(${scale})`;
$('of').textContent = '/' + M.of;
$('label').textContent = showLabel ? M.label : '';
if (hideDot) $('dot').hidden = true;
if (!topic) { document.body.insertAdjacentHTML('beforeend', '<div class="setup"><div>Overlay not linked yet.<br>Open the tracker → <b>More</b> → <b>Stream overlay</b> and copy the overlay link into an OBS Browser source.</div></div>'); return; }

const LS = 'pld-overlay-' + topic + '-' + mode;
let shown = null, lastTs = 0;
function render(n, animate) {
  n = Math.max(0, Math.min(M.of, n | 0));
  $('fill').style.width = (n / M.of * 100) + '%';
  if (shown === null || !animate) { shown = n; $('big').textContent = String(n).padStart(3, '0'); return; }
  const from = shown, to = n; shown = n;
  if (from === to) return;
  const c = $('counter'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
  const steps = Math.min(Math.abs(to - from), 20), dir = Math.sign(to - from);
  let k = 0;
  const tick = () => { k++; const v = k >= steps ? to : from + dir * Math.round(Math.abs(to - from) * k / steps); $('big').textContent = String(v).padStart(3, '0'); if (k < steps) setTimeout(tick, 40); };
  tick();
}
let popT;
function pop(msg) {
  if (!showPop) return;
  const p = $('pop');
  const relevant = msg.kind === 'test' || msg.kind === 'caught' || msg.kind === 'uncaught' || msg.kind === 'boxed' || msg.kind === 'unboxed' || (mode === 'seen' && msg.kind === 'seen');
  if (!relevant || !msg.id) return;
  const off = msg.kind === 'unboxed' || msg.kind === 'uncaught';
  if (mode === 'sinnoh' && msg.sinnoh === false) return;
  p.classList.toggle('unbox', off);
  $('popImg').src = SPRITE(msg.id);
  $('popT1').textContent = msg.kind === 'test' ? 'TEST ALERT' : off ? 'REMOVED' : msg.kind === 'seen' ? 'SEEN!' : 'CAUGHT!';
  $('popT2').textContent = msg.name || '';
  $('popT3').textContent = `#${String(msg.id).padStart(3, '0')}` + (msg[M.key] != null ? `\n${msg[M.key]}/${M.of}` : '');
  p.classList.remove('show'); void p.offsetWidth; p.classList.add('show');
  clearTimeout(popT); popT = setTimeout(() => p.classList.remove('show'), 5500);
}
function handle(raw, live) {
  let msg; try { msg = JSON.parse(raw); } catch (e) { return; }
  if (!msg || msg.app !== 'pld') return;
  if (msg.ts && msg.ts < lastTs) return;
  lastTs = msg.ts || lastTs;
  if (typeof msg[M.key] === 'number') { render(msg[M.key], live); try { localStorage.setItem(LS, JSON.stringify({ n: msg[M.key], ts: lastTs })); } catch (e) {} }
  if (live) pop(msg);
}
// 1) last known value saved in OBS's browser
try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s) { render(s.n, false); lastTs = s.ts || 0; } else render(0, false); } catch (e) { render(0, false); }
// 2) catch up on anything sent while OBS was closed (relay keeps ~12h)
fetch(`https://ntfy.sh/${encodeURIComponent(topic)}/json?poll=1&since=12h`).then(r => r.text()).then(t => {
  const lines = t.trim().split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch (e) { return null; } }).filter(m => m && m.event === 'message');
  if (lines.length) handle(lines[lines.length - 1].message, false);
}).catch(() => {});
// 3) live updates
let es, retry = 1000;
function connect() {
  try { es = new EventSource(`https://ntfy.sh/${encodeURIComponent(topic)}/sse`); } catch (e) { return setTimeout(connect, retry); }
  es.onopen = () => { $('dot').classList.add('on'); retry = 1000; };
  es.onmessage = e => { let d; try { d = JSON.parse(e.data); } catch (x) { return; } if (d.event === 'message') handle(d.message, true); };
  es.onerror = () => { $('dot').classList.remove('on'); es.close(); setTimeout(connect, retry); retry = Math.min(retry * 2, 30000); };
}
connect();
})();
</script>
</body>
</html>
