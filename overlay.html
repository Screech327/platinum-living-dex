<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Dex Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* OBS browser source: 651 x 133. The counter fills the page edge to edge. */
html,body{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;background:transparent}
body{font-family:"Press Start 2P","Courier New",monospace}
.counter,.pop{position:fixed;inset:0;box-sizing:border-box;background:rgba(12,3,5,0.88);border:5px solid #d9142a;border-radius:19px;box-shadow:0 0 0 3px #0b0204}
.nums{position:absolute;left:0;right:0;top:11px;display:flex;justify-content:center;align-items:baseline;line-height:1}
.big{font-size:61px;color:#f4f1f1;text-shadow:5px 5px 0 #6e0a14;font-variant-numeric:tabular-nums}
.of{font-size:29px;color:#d8b9bd}
.bump .big{animation:bump .6s ease}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.12);color:#ffd54a}100%{transform:scale(1)}}
.bar{position:absolute;left:35px;right:35px;bottom:18px;height:16px;box-sizing:border-box;border-radius:8px;background:#2a0a0f;border:3px solid #0b0204}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:#d9142a;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.ball{position:absolute;top:50%;left:0;width:40px;height:40px;box-sizing:border-box;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #0b0204;
  background:linear-gradient(180deg,#d9142a 0 43%,#0b0204 43% 57%,#ffffff 57% 100%);transition:left .9s cubic-bezier(.2,.8,.2,1)}
.ball::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;box-sizing:border-box;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:3px solid #0b0204}
.pop{display:grid;grid-template-columns:110px 1fr auto;align-items:center;column-gap:14px;padding:0 26px 0 12px;border-color:#ffd54a;transform:translateY(120%);transition:transform .45s cubic-bezier(.2,1.25,.4,1)}
.pop.show{transform:none}
.pop img{width:110px;height:110px;image-rendering:pixelated;filter:drop-shadow(4px 4px 0 #0b0204)}
.pop .t1{font-size:12px;color:#ffd54a;letter-spacing:.1em;margin-bottom:12px}
.pop .t2{font-size:26px;color:#f4f1f1;text-shadow:4px 4px 0 #6e0a14;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop .t3{font-size:16px;color:#d8b9bd;white-space:nowrap}
.pop.unbox{border-color:#d8b9bd}
.pop.unbox .t1{color:#d8b9bd}
.setup{position:fixed;inset:0;display:grid;place-items:center;font:14px/1.5 system-ui,sans-serif;color:#fff;background:#111;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="counter" id="counter">
  <div class="nums"><span class="big" id="big">000</span><span class="of" id="of">/493</span></div>
  <div class="bar"><div class="fill" id="fill"></div><div class="ball" id="ball"></div></div>
</div>
<div class="pop" id="pop" aria-live="polite">
  <img id="popImg" alt="">
  <div style="min-width:0"><div class="t1" id="popT1">CAUGHT!</div><div class="t2" id="popT2"></div></div>
  <div class="t3" id="popT3"></div>
</div>
<script>
(() => {
'use strict';
const P = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
const topic = P.get('t');
const mode = P.get('mode') || 'living';              // living | sinnoh | seen
const showPop = P.get('pop') !== '0';
const SPRITE = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iv/platinum/${id}.png`;
const MODES = { living: { key: 'boxed', of: 493, label: 'Living Dex' }, sinnoh: { key: 'caught', of: 210, label: 'Sinnoh caught' }, seen: { key: 'seen', of: 210, label: 'Sinnoh seen' } };
const M = MODES[mode] || MODES.living;
const $ = id => document.getElementById(id);
$('of').textContent = '/' + M.of;
if (!topic) { document.body.insertAdjacentHTML('beforeend', '<div class="setup"><div>Overlay not linked yet.<br>Open the tracker → <b>More</b> → <b>Stream overlay</b> and copy the overlay link into an OBS Browser source.</div></div>'); return; }

const LS = 'pld-overlay-' + topic + '-' + mode;
let shown = null, lastTs = 0;
function render(n, animate) {
  n = Math.max(0, Math.min(M.of, n | 0));
  $('fill').style.width = (n / M.of * 100) + '%'; $('ball').style.left = (n / M.of * 100) + '%';
  if (shown === null || !animate) { shown = n; $('big').textContent = String(n).padStart(3, '0'); return; }
  const from = shown, to = n; shown = n;
  if (from === to) return;
  const c = $('counter'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
  const steps = Math.min(Math.abs(to - from), 20), dir = Math.sign(to - from);
  let k = 0;
  const tick = () => { k++; const v = k >= steps ? to : from + dir * Math.round(Math.abs(to - from) * k / steps); $('big').textContent = String(v).padStart(3, '0'); if (k < steps) setTimeout(tick, 40); };
  tick();
}
let popT;
function pop(msg) {
  if (!showPop) return;
  const p = $('pop');
  const relevant = msg.kind === 'test' || msg.kind === 'caught' || msg.kind === 'uncaught' || msg.kind === 'boxed' || msg.kind === 'unboxed' || (mode === 'seen' && msg.kind === 'seen');
  if (!relevant || !msg.id) return;
  const off = msg.kind === 'unboxed' || msg.kind === 'uncaught';
  if (mode === 'sinnoh' && msg.sinnoh === false) return;
  p.classList.toggle('unbox', off);
  $('popImg').src = SPRITE(msg.id);
  $('popT1').textContent = msg.kind === 'test' ? 'TEST ALERT' : off ? 'REMOVED' : msg.kind === 'seen' ? 'SEEN!' : 'CAUGHT!';
  $('popT2').textContent = msg.name || '';
  $('popT3').textContent = msg[M.key] != null ? `${msg[M.key]}/${M.of}` : `#${String(msg.id).padStart(3, '0')}`;
  p.classList.remove('show'); void p.offsetWidth; p.classList.add('show');
  clearTimeout(popT); popT = setTimeout(() => p.classList.remove('show'), 5500);
}
function handle(raw, live) {
  let msg; try { msg = JSON.parse(raw); } catch (e) { return; }
  if (!msg || msg.app !== 'pld') return;
  if (msg.ts && msg.ts < lastTs) return;
  lastTs = msg.ts || lastTs;
  if (typeof msg[M.key] === 'number') { render(msg[M.key], live); try { localStorage.setItem(LS, JSON.stringify({ n: msg[M.key], ts: lastTs })); } catch (e) {} }
  if (live) pop(msg);
}
// 1) last known value saved in OBS's browser
try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s) { render(s.n, false); lastTs = s.ts || 0; } else render(0, false); } catch (e) { render(0, false); }
// 2) catch up on anything sent while OBS was closed (relay keeps ~12h)
fetch(`https://ntfy.sh/${encodeURIComponent(topic)}/json?poll=1&since=12h`).then(r => r.text()).then(t => {
  const lines = t.trim().split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch (e) { return null; } }).filter(m => m && m.event === 'message');
  if (lines.length) handle(lines[lines.length - 1].message, false);
}).catch(() => {});
// 3) live updates
let es, retry = 1000;
function connect() {
  try { es = new EventSource(`https://ntfy.sh/${encodeURIComponent(topic)}/sse`); } catch (e) { return setTimeout(connect, retry); }
  es.onopen = () => { retry = 1000; };
  es.onmessage = e => { let d; try { d = JSON.parse(e.data); } catch (x) { return; } if (d.event === 'message') handle(d.message, true); };
  es.onerror = () => { es.close(); setTimeout(connect, retry); retry = Math.min(retry * 2, 30000); };
}
connect();
})();
</script>
</body>
</html>
